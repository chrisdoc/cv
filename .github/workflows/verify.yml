name: Verify RenderCV document

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Check dependency lockfile
        run: uv lock --check

      - name: Render CV
        run: mise run build

      - name: Upload PDF file
        uses: actions/upload-artifact@v7
        with:
          name: PDF
          path: CV_Christoph_Kieslich.pdf
